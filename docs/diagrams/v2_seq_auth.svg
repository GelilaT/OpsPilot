ht="20" fill="#FFFFFF" opacity="0.92"/><text x="270" y="112" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">1. sign in (email + password)</text><line x1="430" y1="168" x2="746" y2="168" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"  /><rect x="519.55" y="146" width="140.9" height="20" fill="#FFFFFF" opacity="0.92"/><text x="590" y="160" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">2. signIn.email()</text><line x1="750" y1="216" x2="1386" y2="216" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"  /><rect x="918.7" y="194" width="302.6" height="20" fill="#FFFFFF" opacity="0.92"/><text x="1070" y="208" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">3. verify scrypt hash · create session</text><line x1="750" y1="264" x2="434" y2="264" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"  stroke-dasharray='6 5'/><rect x="519.55" y="242" width="140.9" height="20" fill="#FFFFFF" opacity="0.92"/><text x="590" y="256" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">4. session cookie</text><line x1="430" y1="312" x2="746" y2="312" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"  /><rect x="380.95" y="290" width="418.1" height="20" fill="#FFFFFF" opacity="0.92"/><text x="590" y="304" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">5. getToken() → short-lived JWT (sub, role, site_ids)</text><line x1="430" y1="360" x2="1066" y2="360" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"  /><rect x="552.5" y="338" width="395.00000000000006" height="20" fill="#FFFFFF" opacity="0.92"/><text x="750" y="352" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">6. GET /api/v1/invoices  Authorization: Bearer JWT</text><line x1="1070" y1="408" x2="754" y2="408" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"  stroke-dasharray='6 5'/><rect x="789.5" y="386" width="241.00000000000003" height="20" fill="#FFFFFF" opacity="0.92"/><text x="910" y="400" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">7. fetch /jwks (cached 10 min)</text><path d="M1070,456 h40 v22 h-36" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/><rect x="1116" y="457" width="318" height="20" fill="#FFFFFF" opacity="0.92"/><text x="1120" y="471" text-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">8. verify signature, exp, aud; load role</text><path d="M1070,512 h40 v22 h-36" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"/><rect x="1116" y="513" width="310.3" height="20" fill="#FFFFFF" opacity="0.92"/><text x="1120" y="527" text-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">9. require_role(...) + site scope check</text><line x1="1070" y1="568" x2="1386" y2="568" stroke="#0F766E" stroke-width="2" marker-end="url(#arrT)"  /><rect x="1117.2" y="546" width="225.60000000000002" height="20" fill="#FFFFFF" opacity="0.92"/><text x="1230" y="560" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">10. query scoped to site_ids</text><line x1="1070" y1="616" x2="434" y2="616" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"  stroke-dasharray='6 5'/><rect x="560.2" y="594" width="379.6" height="20" fill="#FFFFFF" opacity="0.92"/><text x="750" y="608" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400"  fill="#0F172A">11. 200 | 401 expired | 403 forbidden (RFC 7807)</text></svg>
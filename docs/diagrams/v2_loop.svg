0"  fill="#475569">supplier invoices · stock counts</text><rect x="430" y="40" width="330" height="140" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="2" /><text x="595" y="88.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="24" font-weight="700"  fill="#B45309">2  Understand</text><text x="595" y="113.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">invoice classification + extraction</text><text x="595" y="138.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">deterministic validation · matching</text><rect x="820" y="40" width="330" height="140" rx="10" fill="#E6F4F1" stroke="#0F766E" stroke-width="2" /><text x="985" y="88.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="24" font-weight="700"  fill="#0F766E">3  Detect</text><text x="985" y="113.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">anomaly rules · price checks</text><text x="985" y="138.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">usage variance · margin drift</text><rect x="1210" y="40" width="330" height="140" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="2" /><text x="1375" y="88.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="24" font-weight="700"  fill="#B45309">4  Investigate</text><text x="1375" y="113.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">driver decomposition · hypotheses</text><text x="1375" y="138.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">evidence chain · AI narrative</text><rect x="40" y="450" width="330" height="140" rx="10" fill="#EAF0F7" stroke="#1F3A5F" stroke-width="2" />
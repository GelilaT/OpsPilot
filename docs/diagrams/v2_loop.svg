t-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">item × daypart demand forecast</text><text x="1375" y="548.5" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">ingredient needs · stock-out risk</text><rect x="540" y="268" width="520" height="92" rx="10" fill="#F1EBFD" stroke="#6D28D9" stroke-width="2" /><text x="800" y="305" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700"  fill="#6D28D9">Operational memory</text><text x="800" y="330" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="15" font-weight="400"  fill="#475569">past investigations · root causes · actions · outcomes</text><rect x="160" y="634" width="22" height="22" rx="4" fill="#E6F4F1" stroke="#0F766E" stroke-width="2"/><text x="192" y="650" text-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="16" font-weight="400"  fill="#0F172A">Deterministic core (owns every number)</text><rect x="620" y="634" width="22" height="22" rx="4" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/><text x="652" y="650" text-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="16" font-weight="400"  fill="#0F172A">AI step + deterministic validation</text><rect x="1080" y="634" width="22" height="22" rx="4" fill="#EAF0F7" stroke="#1F3A5F" stroke-width="2"/><text x="1112" y="650" text-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="16" font-weight="400"  fill="#0F172A">Workflow with human approval</text></svg>
xt-anchor="start" font-family='Helvetica, Arial, sans-serif' font-size="17" font-weight="700"  fill="#1F3A5F">Agent executes and follows up</text><rect x="30" y="150" width="245" height="118" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" /><text x="152.5" y="189" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700"  fill="#0F766E">1  Detect</text><text x="152.5" y="213" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">detector registry</text><text x="152.5" y="237" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">money-ranked severity</text><text x="152.5" y="330" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">price +18% on INV-4471</text><text x="152.5" y="351" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">Fri revenue -18%</text><rect x="305" y="150" width="245" height="118" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" /><text x="427.5" y="189" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700"  fill="#0F766E">2  Investigate</text><text x="427.5" y="213" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">driver tree · hypotheses</text><text x="427.5" y="237" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">evidence chain · memory</text><text x="427.5" y="330" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">short delivery → stock-out</text><text x="427.5" y="351" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">confidence 0.86</text><rect x="580" y="150" width="245" height="118" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" /><text x="702.5" y="189" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700"  fill="#0F766E">3  Recommend</text><text x="702.5" y="213" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">action + computed impact</text><text x="702.5" y="237" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">risk · approver · expiry</text><text x="702.5" y="330" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">switch to Supplier B</text><text x="702.5" y="351" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">+£84 / week</text><rect x="855" y="150" width="245" height="118" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="3.5" /><text x="977.5" y="189" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="21" font-weight="700"  fill="#B45309">4  Human approval</text><text x="977.5" y="213" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">approve · adjust · reject</text><text x="977.5" y="237" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14.5" font-weight="400"  fill="#475569">role + limit checked</text><text x="977.5" y="330" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">GM approves</text><text x="977.5" y="351" text-anchor="middle" font-family='Helvetica, Arial, sans-serif' font-size="14" font-weight="400" font-style='italic' fill="#475569">in the Action Centre</text><rect x="1
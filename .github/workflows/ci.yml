name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://opspilot_app:opspilot_app@localhost:5432/opspilot_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot_test
    steps:
      - uses: actions/checkout@v4
      - name: Create the least-privilege application role
        run: >-
          PGPASSWORD=opspilot psql -h localhost -U opspilot -d opspilot_test -c
          "CREATE ROLE opspilot_app LOGIN PASSWORD 'opspilot_app' NOSUPERUSER NOBYPASSRLS"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m venv .venv && .venv/bin/pip install -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Type check
        run: .venv/bin/pyright
      - name: Import rules (FR-INT-01, SRS 4.1 layering)
        run: .venv/bin/lint-imports
      - name: Migrations are reversible
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ env.TEST_MIGRATION_DATABASE_URL }}
        run: .venv/bin/alembic upgrade head && .venv/bin/alembic downgrade base && .venv/bin/alembic upgrade head
      - name: Tests
        run: .venv/bin/python -m pytest -q
      - name: OpenAPI client is up to date
        run: |
          .venv/bin/python -c "import json; from app.main import create_app; print(json.dumps(create_app().openapi(), indent=1))" > /tmp/openapi.json
          diff -q /tmp/openapi.json ../web/lib/api/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

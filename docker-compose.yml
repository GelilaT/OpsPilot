# Local development stack (SRS 2.2): postgres + pgvector, api, worker, web.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot"]
      interval: 3s
      retries: 20

  migrate:
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://opspilot_app:opspilot_app@db:5432/opspilot
      MIGRATION_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@db:5432/opspilot
      JWKS_URL: http://web:8080/api/auth/jwks
      JWT_ISSUER: http://localhost:3000
      JWT_AUDIENCE: http://localhost:3000
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: ./api
    command: ["python", "-m", "app.seed"]
    environment: *api-env
    profiles: ["seed"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    build: ./api
    environment: *api-env
    ports: ["8000:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./api
    command: ["procrastinate", "--app=app.workers.app.app", "worker"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      DATABASE_URL: postgresql://opspilot_app:opspilot_app@db:5432/opspilot
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-better-auth-secret-change-me}
      API_URL: http://api:8080
      CRON_SECRET: ${CRON_SECRET:-dev-cron-secret}
    ports: ["3000:8080"]
    depends_on: [api]

volumes:
  pgdata:
